name: 嗅探州官方接口

# 一次性任务：对尚未接入的州批量打开官方结果页，记录它们实际调用的机读接口。
# 结果作为 probe_results.json artifact 上传，用来给 state_sources.json 配 URL / 选适配器。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 批量嗅探
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
          CHROME_NO_SANDBOX: '1'
          CI: 'true'
        run: |
          set -o pipefail
          python3 scripts/probe_states.py 2>&1 | tee probe.log

      - name: 上传探测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: |
            probe_results.json
            probe.log
          retention-days: 7
          if-no-files-found: ignore
